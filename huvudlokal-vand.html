<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nilis – Verksamhetskarta</title>
<link rel="stylesheet" href="css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body.map-page {
  background: #f0f0f0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-family: 'Segoe UI', Arial, sans-serif;
}

.back-link {
  padding: 10px 16px;
  flex-shrink: 0;
}
.back-link a {
  color: #2c5f8a;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
}
.back-link a:hover { text-decoration: underline; }

.toggle-view {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 100;
}
.toggle-view a {
  background: rgba(255,255,255,0.9);
  border: 1px solid #ccc;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.83rem;
  font-weight: 600;
  color: #2c3e50;
  text-decoration: none;
}

.map-wrapper {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 8px;
}

/* Base map image – fits within viewport */
.map-image {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* Hover overlay images */
.hover-image {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

/* Hotspots */
.hotspot {
  position: absolute;
  cursor: pointer;
  z-index: 10;
}

/* Normal vy – Fönster (vänster del av kartan) */
.fonster {
  top: 45%; left: 8%;
  width: 16%; height: 20%;
}

/* Normal vy – Örn (nedre mitt) */
.orn {
  top: 55%; left: 26%;
  width: 20%; height: 25%;
}

/* Vänd vy – Fönster */
.vand-fonster {
  top: 38%; left: 56%;
  width: 17%; height: 20%;
}

/* Vänd vy – Örn */
.vand-orn {
  top: 10%; left: 57%;
  width: 22%; height: 25%;
}

/* Show hover on hotspot hover */
.hotspot.fonster:hover ~ .hover-fonster,
.hotspot.orn:hover ~ .hover-orn,
.hotspot.vand-fonster:hover ~ .hover-vand-fonster,
.hotspot.vand-orn:hover ~ .hover-vand-orn { opacity: 1; }
</style>
</head>

<body class="map-page">

<div class="back-link">
<a href="index.html">← Tillbaka till Nilis</a>
</div>

<div class="toggle-view">
<a href="huvudlokal-vand.html">Byt vy</a>
</div>

<div class="read-top">

<button class="read-button stop-button" onclick="toggleRead()">
🔊 Svenska
</button>

<button class="read-button read-btn-en" onclick="readEnglish()">
🔊 English
</button>

<button class="read-button read-btn-ar" onclick="readArabic()">
🔊 العربية
</button>

<button class="read-button read-btn-so" onclick="readSomali()">
🔊 Somali
</button>

</div>

<div class="readable-content-wrapper" style="display:none;">

Nilis daglig verksamhet.
Här kan du utforska verksamheten genom att klicka på olika grupper
i kartan. Välj en grupp för att läsa mer om hur de arbetar,
vilken teknik som används och vilka aktiviteter som finns.

</div>

<div class="map-wrapper">

<img src="images/nilis.png"
     class="map-image"
     alt="Nilis karta">

<a href="groups/fonster.html"
   class="hotspot fonster"
   aria-label="Fönstergruppen"></a>

<img src="images/hover-fonster.png"
     class="map-image hover-image hover-fonster"
     alt="">

<a href="groups/orngrupp.html"
   class="hotspot orn"
   aria-label="Örngruppen"></a>

<img src="images/hover-orn.png"
     class="map-image hover-image hover-orn"
     alt="">

</div>

<script src="js/read.js"></script>

</body>
</html>
