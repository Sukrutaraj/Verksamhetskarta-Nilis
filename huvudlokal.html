<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilis – Verksamhetskarta</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Stäng av CSS-hover för individuella bilder - hanteras av JS */
        .fonster:hover ~ .hover-fonster { opacity: 0; }
        .orn:hover ~ .hover-orn { opacity: 0; }
        .hover-alla {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body class="map-page">

<div class="back-link">
    <a href="index.html">← Tillbaka till Nilis</a>
</div>

<div class="toggle-view">
    <a href="huvudlokal-vand.html">Byt vy</a>
</div>

<div class="view-toggle" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;">
    <button id="toggleStructure" class="structure-btn" style="padding:8px 16px;background:rgba(0,80,160,0.85);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;">Visa grupper</button>
</div>

<div class="read-top">
    <button class="read-button stop-button" onclick="toggleRead()">🔊 Svenska</button>
    <button class="read-button read-btn-en" onclick="readEnglish()">🔊 English</button>
    <button class="read-button read-btn-ar" onclick="readArabic()">🔊 العربية</button>
    <button class="read-button read-btn-so" onclick="readSomali()">🔊 Somali</button>
</div>

<div class="readable-content-wrapper" style="display:none;">
Nilis daglig verksamhet.
</div>

<div class="map-wrapper">

    <img src="images/nilis.png"
         class="map-image base-image"
         alt="Nilis karta">

    <img src="images/hover-alla.png"
         class="hover-alla"
         alt="Alla grupper">

    <img src="images/hover-fonster.png"
         class="map-image hover-image hover-fonster"
         alt="">

    <img src="images/hover-orn.png"
         class="map-image hover-image hover-orn"
         alt="">

    <a href="groups/fonster.html"
       class="hotspot fonster"
       id="hs-fonster"
       aria-label="Fönstergruppen"></a>

    <a href="groups/orngrupp.html"
       class="hotspot orn"
       id="hs-orn"
       aria-label="Örngruppen"></a>

</div>

<script src="js/read.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {

    var showingAll = false;
    var hoverAlla   = document.querySelector('.hover-alla');
    var hoverFonster = document.querySelector('.hover-fonster');
    var hoverOrn     = document.querySelector('.hover-orn');
    var hsFonster    = document.getElementById('hs-fonster');
    var hsOrn        = document.getElementById('hs-orn');
    var btn          = document.getElementById('toggleStructure');

    // Individuell hover via JS
    hsFonster.addEventListener('mouseenter', function() {
        if (!showingAll) hoverFonster.style.opacity = '1';
    });
    hsFonster.addEventListener('mouseleave', function() {
        hoverFonster.style.opacity = '0';
    });

    hsOrn.addEventListener('mouseenter', function() {
        if (!showingAll) hoverOrn.style.opacity = '1';
    });
    hsOrn.addEventListener('mouseleave', function() {
        hoverOrn.style.opacity = '0';
    });

    // Visa grupper
    btn.addEventListener('click', function() {
        showingAll = !showingAll;
        if (showingAll) {
            hoverAlla.style.opacity = '1';
            hoverFonster.style.opacity = '0';
            hoverOrn.style.opacity = '0';
            btn.textContent = 'Dölj grupper';
        } else {
            hoverAlla.style.opacity = '0';
            btn.textContent = 'Visa grupper';
        }
    });
});
</script>

</body>
</html>
