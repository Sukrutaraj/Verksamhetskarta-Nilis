<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilis – Verksamhetskarta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=T0bKfJIE"></script>
</head>

<body class="map-page">

<div class="back-link">
    <a href="index.html">← Tillbaka till Nilis</a>
</div>

<div class="view-toggle">
    <button id="toggleStructure">Visa grupper</button>
    <button id="toggleView">Vänd vy</button>
</div>

<div class="readable-content-wrapper" style="display:none;">
Nilis daglig verksamhet.
Här kan du utforska verksamheten genom att klicka på olika grupper
i kartan. Välj en grupp för att läsa mer om hur de arbetar,
vilken teknik som används och vilka aktiviteter som finns.
</div>

<!-- NORMAL VY -->
<div id="normalView" class="map-view active-view">
    <div class="map" style="position:relative;">

        <img src="images/nilis.png"
             class="map-image"
             alt="Nilis karta">

        <img src="images/hover-alla.png"
             class="map-image hover-image structure-overlay"
             alt="">

        <a href="groups/fonster.html"
           class="hotspot fonster"
           aria-label="Fönstergruppen"></a>

        <img src="images/hover-fonster.png"
             class="map-image hover-image hover-fonster"
             alt="">

        <a href="groups/orngrupp.html"
           class="hotspot orn"
           aria-label="Örngruppen"></a>

        <img src="images/hover-orn.png"
             class="map-image hover-image hover-orn"
             alt="">

    </div>
</div>

<!-- VÄND VY -->
<div id="vandView" class="map-view">
    <div class="map" style="position:relative;">

        <img src="images/nilis-vand.png"
             class="map-image"
             alt="Nilis vänd">

        <img src="images/hover-vand-alla.png"
             class="map-image hover-image structure-overlay"
             alt="">

        <a href="groups/fonster.html"
           class="hotspot vand-fonster"
           aria-label="Fönstergruppen"></a>

        <img src="images/hover-vand-fonster.png"
             class="map-image hover-image hover-vand-fonster"
             alt="">

        <a href="groups/orngrupp.html"
           class="hotspot vand-orn"
           aria-label="Örngruppen"></a>

        <img src="images/hover-vand-orn.png"
             class="map-image hover-image hover-vand-orn"
             alt="">

    </div>
</div>

<script src="js/map-controls.js"></script>
<script src="js/read.js"></script>

</body>
</html>
